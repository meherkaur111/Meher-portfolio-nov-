html,body{background:#F9EADF;margin:0}
.pr{position:relative;height:100vh;height:100svh;overflow:hidden;background:#F9EADF;touch-action:none}
.pr-stage{position:absolute;inset:0;overflow:hidden;background:#F9EADF}
.pr-media{position:absolute;inset:0;will-change:transform}
.pr-media video,.pr-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.pr-poster{transition:opacity .3s ease}
.pr-bar{position:absolute;left:0;right:0;height:7vh;background:#0B0708;z-index:3}
.pr-bar.top{top:0;transform-origin:top}.pr-bar.bot{bottom:0;transform-origin:bottom}
.pr-credit{position:absolute;left:clamp(24px,4.6vw,76px);top:50%;transform:translateY(-55%);z-index:4;text-align:left;color:#170D0F;font-family:"Playfair Display",Georgia,serif;
  transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.pr-credit .name span{display:block;font-weight:900;font-size:clamp(44px,5.4vw,86px);line-height:.95;letter-spacing:-.01em}
.pr-credit .presents{display:block;margin-top:14px;font-size:clamp(20px,2.1vw,32px);font-style:italic;font-weight:400}
.pr-cue{position:absolute;left:50%;bottom:calc(7vh + 1.6vh);transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:7px;color:#FFF7F9;font-family:"Playfair Display",Georgia,serif;font-size:13px;font-weight:700;letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;text-shadow:0 1px 14px rgba(11,7,8,.75);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.pr-cue i{display:block;width:1.5px;height:30px;background:linear-gradient(#FFF7F9,rgba(255,247,249,0));animation:prcue 1.6s ease-in-out infinite}
@keyframes prcue{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}
.pr-sound{position:absolute;top:calc(3.5vh - 15px);right:max(16px,3vw);z-index:8;display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,247,249,.6);background:rgba(11,7,8,.35);color:#FFF7F9;font:13px "Playfair Display",Georgia,serif;letter-spacing:.06em;cursor:pointer}
.pr-sound:focus-visible{outline:2px solid #F27D9A;outline-offset:3px}
.pr-sound svg{width:15px;height:15px}
.pr-flood{position:absolute;inset:0;background:linear-gradient(125deg,#F8E2E1 0%,#F9E8E0 38%,#FAEEDB 62%,#F9EFCF 100%);opacity:0;z-index:6;pointer-events:none}
.pr.played .pr-credit,.pr.played .pr-cue{opacity:0}
.pr.played .pr-credit{transform:translate(-14px,-55%)}
.pr.played .pr-cue{transform:translate(-50%,8px)}
@media (max-width:820px),(max-aspect-ratio:5/4){
  .pr-bar{height:5vh}
  .pr-credit{left:0;right:0;top:auto;bottom:calc(5vh + 10vh);transform:none;text-align:center;color:#FFF7F9;text-shadow:0 2px 22px rgba(11,7,8,.85)}
  .pr-credit .name{display:block;padding-left:.14em}
  .pr-credit .name span{display:inline;font-size:clamp(22px,6.4vw,40px);letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
  .pr-credit .presents{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;font-size:clamp(16px,4.4vw,22px)}
  .pr-credit .presents::before,.pr-credit .presents::after{content:"";width:clamp(36px,12vw,64px);height:1px;background:#FFF7F9;opacity:.75}
  .pr.played .pr-credit{transform:translateY(8px)}

.mm{position:relative;min-height:100vh;min-height:100dvh;background:linear-gradient(125deg,#F8E2E1 0%,#F9E8E0 38%,#FAEEDB 62%,#F9EFCF 100%);color:#170D0F;overflow:hidden;font-family:"Playfair Display",Georgia,"Times New Roman",serif;
  display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);grid-template-rows:auto 1fr;
  padding:clamp(28px,5vh,64px) max(16px,4vw) 0;box-sizing:border-box;--mx:-999px;--my:-999px}
.mm *{box-sizing:border-box}
.mm-dots{position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,#D9BBAE 1.2px,transparent 1.5px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(circle 170px at var(--mx) var(--my),#000 0,rgba(0,0,0,.35) 55%,transparent 100%);
  mask-image:radial-gradient(circle 170px at var(--mx) var(--my),#000 0,rgba(0,0,0,.35) 55%,transparent 100%)}
.mm-glow{position:absolute;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(190,110,110,.28),rgba(190,110,110,0) 70%);transform:translate(var(--gx,-999px),var(--gy,-999px));opacity:var(--go,0);transition:opacity .4s}
.mm-intro{grid-column:1;grid-row:1;position:relative;z-index:2}
.mm-intro h2{font-weight:700;font-size:clamp(28px,2.8vw,42px);line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
.mm-intro p{font-size:clamp(17px,1.5vw,22px);margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:12px}
.mm-pill{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 13px;border-radius:999px;background:#170D0F}
.mm-pill i{display:block;width:3px;border-radius:2px;background:#F9EADF;animation:mmwave 1.1s ease-in-out infinite}
.mm-pill i:nth-child(2){animation-delay:.12s}.mm-pill i:nth-child(3){animation-delay:.24s}.mm-pill i:nth-child(4){animation-delay:.36s}.mm-pill i:nth-child(5){animation-delay:.48s}.mm-pill i:nth-child(6){animation-delay:.6s}
@keyframes mmwave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.mm-char{grid-column:1;grid-row:2;align-self:end;position:relative;z-index:1;width:min(100%,560px);aspect-ratio:${vc}/${dp}}
.mm-char img,.mm-eye{position:absolute;inset:0;width:100%;height:100%}
.mm-char img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mm-eye{-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.mm-eye img{will-change:transform}
.mm-mapwrap{grid-column:2;grid-row:1 / span 2;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding-bottom:clamp(16px,3vh,40px)}
.mm-map{position:relative;width:min(100%,calc((100dvh - 60px) * 800 / 892));aspect-ratio:800/892}
.mm-map>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.mm-pin{position:absolute;transform:translate(-7px,-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;z-index:2}
.mm-pin.d-left{flex-direction:row-reverse;transform:translate(calc(-100% + 7px),-50%)}
.mm-dot{width:14px;height:14px;border-radius:50%;background:#170D0F;border:2px solid #F9EADF;flex:none;transition:transform .2s}
.mm-pin.next .mm-dot{background:#F27D9A;animation:mmpulse 1.8s ease-out infinite}
@keyframes mmpulse{0%{box-shadow:0 0 0 0 rgba(190,110,110,.55)}100%{box-shadow:0 0 0 16px rgba(190,110,110,0)}}
.mm-tag{background:#fff;border:1px solid #170D0F;border-radius:999px;padding:4px 12px;white-space:nowrap;text-align:left;font-size:clamp(12px,1vw,15px);line-height:1.2;transition:background .2s,color .2s}
.mm-tag small{display:block;font-size:.72em;font-style:italic;color:#5C1A24}
.mm-pin.next .mm-tag{font-style:italic}
.mm-pin:hover .mm-dot,.mm-pin[aria-expanded="true"] .mm-dot{transform:scale(1.25)}
.mm-pin:hover .mm-tag,.mm-pin[aria-expanded="true"] .mm-tag{background:#170D0F;color:#F9EADF}
.mm-pin:hover .mm-tag small,.mm-pin[aria-expanded="true"] .mm-tag small{color:#E9CDC8}
.mm-pin:focus-visible{outline:2px solid #5C1A24;outline-offset:4px;border-radius:999px}
.mm-card{position:absolute;z-index:5;width:min(290px,80vw);background:#fff;border:1.5px solid #170D0F;border-radius:6px;padding:18px 20px 20px;box-shadow:6px 6px 0 #9A4450;animation:mmcard .22s ease-out}
@keyframes mmcard{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mm-card h3{margin:0 28px 4px 0;font-size:20px;font-weight:700}
.mm-card .meta{margin:0 0 10px;font-size:13px;font-style:italic;color:#5C1A24}
.mm-card .body{margin:0;font-size:15px;line-height:1.5}
.mm-close{position:absolute;top:10px;right:10px;width:28px;height:28px;border:0;border-radius:50%;background:#F9EADF;color:#170D0F;font-size:18px;line-height:28px;cursor:pointer}
.mm-close:focus-visible{outline:2px solid #5C1A24}
@media (max-width:820px){
  .mm{display:flex;flex-direction:column;gap:20px;padding-bottom:24px}
  .mm-char{width:min(88%,420px);align-self:flex-start}
  .mm-mapwrap{padding:0}
  .mm-map{width:100%}
  .mm-dots,.mm-glow{display:none}
  .mm-pin.m-right{flex-direction:row;transform:translate(-6px,-50%)}
  .mm-pin.m-left{flex-direction:row-reverse;transform:translate(calc(-100% + 6px),-50%)}
  .mm-dot{width:12px;height:12px}
  .mm-tag{font-size:11px;padding:3px 8px}
  .mm-tag small{display:none}
  .mm-card{position:fixed!important;left:12px!important;right:12px;bottom:12px;top:auto!important;width:auto}
}
@media (prefers-reduced-motion:reduce){.mm-pill i,.mm-pin.next .mm-dot,.mm-card{animation:none}}
