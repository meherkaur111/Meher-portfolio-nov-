html,body{background:#EAF5FA;margin:0}
/* the hero overlaps the top of the next screen, so when the dive finishes the panther screen simply fades away
   and you are already standing on the "Hi" page: no seam, no jump */
.pr{position:relative;z-index:2;height:200vh;height:200lvh;margin-bottom:-100vh;margin-bottom:-100lvh;pointer-events:none}
.pr-stage{position:sticky;top:0;height:100vh;height:100lvh;overflow:hidden;background:#0B0708;pointer-events:auto}
.pr-media{position:absolute;inset:0;will-change:transform}
.pr-media video,.pr-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.pr-poster{transition:opacity .3s ease}
.pr-credit{position:absolute;left:clamp(24px,4.6vw,76px);top:50%;transform:translateY(-55%);z-index:4;text-align:left;color:#170D0F;font-family:"Playfair Display",Georgia,serif;pointer-events:none;will-change:opacity,transform}
.pr-credit .name span{display:block;font-weight:900;font-size:clamp(44px,5.4vw,86px);line-height:.95;letter-spacing:-.01em}
.pr-credit .presents{display:block;margin-top:14px;font-size:clamp(20px,2.1vw,32px);font-style:italic;font-weight:400}
.pr-cue{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:7px;color:#FFF7F9;font-family:"Playfair Display",Georgia,serif;font-size:13px;font-weight:700;letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;text-shadow:0 1px 14px rgba(11,7,8,.75);pointer-events:none}
.pr-cue i{display:block;width:1.5px;height:30px;background:linear-gradient(#FFF7F9,rgba(255,247,249,0));animation:prcue 1.6s ease-in-out infinite}
@keyframes prcue{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}
.pr-sound{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(16px,3vw);z-index:8;display:flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,247,249,.6);background:rgba(11,7,8,.35);color:#FFF7F9;font:13px "Playfair Display",Georgia,serif;letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s}
.pr-sound:focus-visible{outline:2px solid #F27D9A;outline-offset:3px}
.pr-sound svg{width:15px;height:15px}
.pr-flood{position:absolute;left:0;right:0;top:0;height:100%;z-index:6;pointer-events:none;background:#3F8FD0 url(bg-glass.webp) center/cover no-repeat;clip-path:circle(0px at 50% 50%);-webkit-clip-path:circle(0px at 50% 50%)}
/* phones and tall screens: the poster fills the whole screen, name in caps at the bottom */
@media (max-width:820px),(max-aspect-ratio:5/4){
  .pr-credit{left:0;right:0;top:auto;bottom:calc(9vh + 54px);transform:none;text-align:center;color:#FFF7F9;text-shadow:0 2px 22px rgba(11,7,8,.85)}
  .pr-credit .name{display:block;padding-left:.14em}
  .pr-credit .name span{display:inline;font-size:clamp(22px,6.4vw,40px);letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
  .pr-credit .presents{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;font-size:clamp(16px,4.4vw,22px)}
  .pr-credit .presents::before,.pr-credit .presents::after{content:"";width:clamp(36px,12vw,64px);height:1px;background:#FFF7F9;opacity:.75}
  .pr-cue{bottom:calc(5vh + 8px)}
}

.xp-back{position:fixed;inset:0;z-index:70;background:rgba(10,20,40,.18);opacity:0;animation:xpfade .3s ease forwards}
@keyframes xpfade{to{opacity:1}}
.xp{position:fixed;z-index:71;left:clamp(16px,3.5vw,56px);top:84px;bottom:24px;width:min(560px,calc(100vw - 32px));overflow-y:auto;overscroll-behavior:contain;
  background:#FCFDFE;color:#0E1116;border-radius:30px;box-shadow:0 30px 80px rgba(10,30,60,.28);font-family:Inter,system-ui,sans-serif;
  padding:44px 36px 32px;box-sizing:border-box;scrollbar-width:thin;animation:xpin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes xpin{from{opacity:0;translate:-24px 0;scale:.98}to{opacity:1;translate:0 0;scale:1}}
.xp-x{position:absolute;top:22px;right:22px;width:42px;height:42px;border-radius:50%;border:0;background:#EEF2F6;color:#0E1116;font-size:20px;line-height:1;cursor:pointer}
.xp-x:hover{background:#E2E8EF}
.xp-x:focus-visible,.xp-cta:focus-visible{outline:2px solid #0593C6;outline-offset:2px}
.xp h2{font-family:Manrope,Inter,sans-serif;font-size:clamp(34px,4vw,46px);font-weight:700;letter-spacing:-.045em;line-height:1;margin:0;padding-right:48px}
.xp-role{font-size:15px;font-weight:500;color:#5B6573;margin-top:10px}
.xp-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.xp-chips span{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:linear-gradient(90deg,rgba(5,147,198,.14),rgba(216,57,149,.14));color:#9A2A6C}
.xp-line{font-family:Manrope,Inter,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.025em;margin:26px 0 14px}
.xp ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.xp li{position:relative;padding-left:20px;font-size:15.5px;line-height:1.6;color:#4A5461}
.xp li b{color:#0E1116;font-weight:600}
.xp li:before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#0593C6,#D83995)}
.xp-k{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5B6573;margin:30px 0 14px}
.xp-gal{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.xp-pol{background:#fff;padding:10px 10px 14px;border-radius:6px;box-shadow:0 10px 26px rgba(10,30,60,.14);rotate:-2deg;transition:rotate .3s,translate .3s}
.xp-pol:nth-child(2){rotate:2deg}
.xp-pol:hover{rotate:0deg;translate:0 -3px}
.xp-pol .ph{aspect-ratio:4/3;border-radius:3px;background:linear-gradient(135deg,#D6ECF6,#F6D5E7);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:rgba(14,17,22,.45);overflow:hidden}
.xp-pol img{width:100%;height:100%;object-fit:cover;display:block}
.xp-pol .cap{text-align:center;font-size:13px;font-weight:500;margin-top:10px;color:#3E4652;min-height:16px}
.xp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.xp-stat{padding:16px 14px;border-radius:18px;background:linear-gradient(160deg,rgba(5,147,198,.08),rgba(216,57,149,.10))}
.xp-stat b{display:block;font-family:Manrope,Inter,sans-serif;font-size:clamp(22px,2.3vw,28px);font-weight:700;letter-spacing:-.035em;line-height:1.05;background:linear-gradient(90deg,#0593C6,#D83995);-webkit-background-clip:text;background-clip:text;color:transparent}
.xp-stat span{display:block;font-size:13px;line-height:1.35;color:#5B6573;margin-top:6px}
.xp-cta{display:inline-flex;align-items:center;gap:10px;margin-top:26px;height:52px;padding:0 24px;border-radius:999px;border:0;background:#0E1116;color:#fff;font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;transition:background .2s,gap .2s}
.xp-foot{position:sticky;bottom:-32px;margin:18px -36px -32px;padding:24px 36px 28px;background:linear-gradient(rgba(252,253,254,0),#FCFDFE 34%);z-index:2}
.xp-foot .xp-cta{margin-top:0;box-shadow:0 12px 26px rgba(10,30,60,.22)}
.xp-cta:hover{background:linear-gradient(90deg,#0593C6,#D83995);gap:14px}
@media (max-width:760px){
  .xp{left:0;right:0;top:auto;bottom:0;width:auto;max-height:88vh;border-radius:28px 28px 0 0;padding:40px 22px 28px;animation-name:xpup}
  @keyframes xpup{from{translate:0 40px;opacity:0}to{translate:0 0;opacity:1}}
  .xp-foot{bottom:-28px;margin:18px -22px -28px;padding:20px 22px 22px}.xp-foot .xp-cta{width:100%;justify-content:center}
  .xp-stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.xp-stat{padding:12px 10px}
}
@media (prefers-reduced-motion:reduce){.xp,.xp-back{animation:none;opacity:1}}

.wf-wave i{width:3px;height:4px;border-radius:2px;background:#fff;transition:height .12s ease}
.wf-st{font-size:12.5px;font-weight:500;opacity:.9;min-width:86px}
.wf-tg{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.wf-tg .sw{position:relative;width:36px;height:22px;border-radius:999px;background:rgba(255,255,255,.3);transition:background .25s}
.wf-tg .sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:translate .25s cubic-bezier(.2,.7,.2,1);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.wf-tg[aria-checked="true"] .sw{background:linear-gradient(90deg,#0593C6,#D83995)}
.wf-tg[aria-checked="true"] .sw:after{translate:14px 0}
.wf-tg:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wf-txt{margin:0;font-size:17px;line-height:1.62;letter-spacing:-.005em;color:rgba(255,255,255,.96);min-height:9.5em}
.wf-w{display:none}
.wf-w.on{display:inline;animation:wfin .3s ease both}
@keyframes wfin{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
/* the cut parts: struck live while dictating, then removed from the line once it's all written */
.wf-c{font-size:1em;transition:font-size .3s cubic-bezier(.6,0,.3,1),color .25s ease;
  background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 58%;background-size:0% 1.5px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.wf-c.strike{color:rgba(255,255,255,.5);background-size:100% 1.5px;transition:background-size .3s ease,color .25s ease,font-size .3s cubic-bezier(.6,0,.3,1)}
.wf-c.gone{font-size:0}
.wf-caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:#fff;animation:wfblink 1s steps(1) infinite}
@keyframes wfblink{50%{opacity:0}}
.wf-sign{margin-top:14px;font-family:Caveat,"Segoe Script",cursive;font-size:22px;color:rgba(255,255,255,.92);opacity:0;translate:0 6px;transition:opacity .6s ease,translate .6s ease}
.wf-sign.on{opacity:1;translate:0 0}
@media (prefers-reduced-motion:reduce){.wf-w,.wf-c,.wf-sign{transition:none}}

.hi-card .loc{font-size:13.5px;opacity:.9;margin:0 4px 12px}
.hi-gc{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);margin-top:10px}
.hi-gc .t{display:flex;justify-content:space-between;font-size:14px;opacity:.9}.hi-gc .t small{font-size:12px;opacity:.8}
.hi-gc .big{font-size:24px;font-weight:500;margin-top:10px;letter-spacing:-.025em}.hi-gc .lbl{font-size:13px;opacity:.8;margin-top:4px}

  -webkit-mask-image:linear-gradient(#000 90%,transparent);mask-image:linear-gradient(#000 90%,transparent)}

.jn{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#EAF5FA;color:#0E1116;font-family:Inter,system-ui,sans-serif}
.jn h1,.jn h3{font-family:Manrope,Inter,sans-serif}
.jn-bg{position:absolute;inset:-12% 0;pointer-events:none;background:#EAF5FA url(bg-soft.webp) center/cover no-repeat}
.jn-wrap{position:relative;z-index:2;max-width:1280px;margin:0 auto;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:56px;align-items:center;padding:96px 48px 64px}
.jn-chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
.jn-chip i{width:7px;height:7px;border-radius:50%;background:#D83995}
.jn h1{font-weight:500;font-size:clamp(40px,4.4vw,64px);letter-spacing:-.04em;line-height:1.02;margin:18px 0 16px}
.jn h1 span{background:linear-gradient(90deg,#0593C6,#D83995);-webkit-background-clip:text;background-clip:text;color:transparent}
.jn-p{font-size:17px;line-height:1.55;color:#5B6573;margin:0}
.jn-stops{margin-top:26px;display:flex;flex-direction:column;gap:8px}
.jn-stop{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 18px;border-radius:16px;font:inherit;font-size:15px;text-align:left;cursor:pointer;color:#0E1116;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s,color .2s,transform .2s}
.jn-stop small{color:#5B6573;font-size:13px}
.jn-stop:hover{transform:translateX(4px)}
.jn-stop.on{background:#0E1116;color:#fff}.jn-stop.on small{color:rgba(255,255,255,.7)}
.jn-stop.next{background:linear-gradient(90deg,#0593C6,#D83995);color:#fff;border:0}.jn-stop.next small{color:rgba(255,255,255,.85)}
.jn-stop:focus-visible,.jn-pin:focus-visible,.jn-x:focus-visible,.jn-tab:focus-visible{outline:2px solid #0593C6;outline-offset:3px}
.jn-map{position:relative;width:100%;max-width:620px;justify-self:center;aspect-ratio:800/892}
.jn-map>img{position:absolute;inset:0;width:100%;height:100%}
/* pins: big invisible hit area so they are easy to tap */
.jn-pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:none;cursor:pointer;z-index:3}
.jn-pin i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#0E1116;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.25);transition:transform .2s}
.jn-pin:hover i,.jn-pin.on i{transform:scale(1.45)}
.jn-pin.quiet{cursor:default}.jn-pin.quiet i{background:#8A93A0;width:10px;height:10px;margin:-5px 0 0 -5px}.jn-pin.quiet:hover i{transform:none}.jn-pin.quiet b{opacity:.85}
.jn-pin.next i{background:#D83995;animation:jnpulse 1.8s ease-out infinite}
.jn-pin b{position:absolute;left:34px;top:50%;translate:0 -50%;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.9);font-size:12px;font-weight:500;display:flex;align-items:center;white-space:nowrap;box-shadow:0 2px 8px rgba(10,30,60,.08)}
@keyframes jnpulse{0%{box-shadow:0 0 0 0 rgba(216,57,149,.5)}100%{box-shadow:0 0 0 14px rgba(216,57,149,0)}}
/* pins drop in one after another when the map scrolls into view */
.jn-map[data-in] .jn-pin{animation:jnpin .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes jnpin{from{opacity:0;translate:0 -10px}to{opacity:1;translate:0 0}}
/* the card that opens from a pin */
.jn-card{position:absolute;z-index:6;width:420px;max-width:calc(100vw - 32px);padding:16px;border-radius:24px;background:rgba(255,255,255,.9);border:1px solid #fff;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 24px 60px rgba(10,30,60,.18);animation:jncard .22s ease-out}
@keyframes jncard{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
.jn-card .ph{height:130px;border-radius:16px;background:linear-gradient(135deg,#BFE3F2,#F3C3DD);display:flex;align-items:center;justify-content:center;color:rgba(14,17,22,.45);font-size:12.5px}
.jn-seg{display:flex;gap:4px;padding:4px;margin-top:12px;border-radius:14px;background:rgba(14,17,22,.06)}
.jn-tab{flex:1;font:inherit;font-size:13px;font-weight:500;padding:8px 10px;border-radius:10px;border:0;background:none;color:#5B6573;cursor:pointer;transition:background .2s,color .2s}
.jn-tab.on{background:#fff;color:#0E1116;box-shadow:0 2px 8px rgba(10,30,60,.1)}
.jn-tag{display:inline-block;margin-top:14px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,rgba(5,147,198,.12),rgba(216,57,149,.12));color:#9A2A6C}
.jn-card h3{margin:8px 0 2px;font-size:22px;font-weight:600;letter-spacing:-.025em}
.jn-card .role{font-size:13.5px;color:#0593C6;margin:0 0 10px}
.jn-pts{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.jn-pts li{position:relative;padding-left:16px;font-size:14px;line-height:1.45;color:#3E4652}
.jn-pts li:before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,#0593C6,#D83995)}
.jn-cta{margin-top:14px;width:100%;height:44px;border:0;border-radius:14px;font:inherit;font-size:14.5px;font-weight:500;color:#fff;cursor:pointer;background:linear-gradient(90deg,#0593C6,#D83995);transition:filter .2s}
.jn-cta:hover{filter:brightness(1.06)}
.jn-cta:focus-visible{outline:2px solid #0E1116;outline-offset:3px}
.jn-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.95);cursor:pointer;font-size:17px;line-height:30px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
@media (max-width:900px){.jn-wrap{grid-template-columns:1fr;gap:28px;padding:88px 20px 48px}.jn-map{max-width:440px;order:-1}
  .jn-card{position:fixed;left:16px!important;right:16px;bottom:16px;width:auto;max-width:none;top:auto!important;max-height:78vh;overflow-y:auto}}

.jn-pin.next i{animation:none}.jn-map[data-in] .jn-pin{animation:none}}

.tk-bg{position:absolute;inset:-8% 0;pointer-events:none;background:#EAF5FA url(bg-soft.webp) center/cover no-repeat}
.tk-in{position:relative;z-index:1;width:100%;max-width:1240px;margin:0 auto;padding:96px 48px;display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:clamp(40px,6.5vw,100px);align-items:center;box-sizing:border-box}
/* three photos of her setup: one tall frame, two stacked beside it */

.tk-ph{position:relative;margin:0;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 22px 50px rgba(10,30,60,.14),0 0 0 5px rgba(255,255,255,.75)}

.tk-ph:hover img{scale:1.04}

.tk.on .tk-fade{opacity:1;translate:0 0}
.tk-k{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;background:rgba(255,255,255,.75);border:1px solid #fff}
.tk-k i{width:7px;height:7px;border-radius:50%;background:#D83995}
.tk-q{font-family:Manrope,Inter,sans-serif;font-size:clamp(32px,3.8vw,54px);font-weight:600;letter-spacing:-.045em;line-height:1.06;margin:18px 0 0}
.tk-done{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px 0 4px;border-radius:999px;background:#0E1116;color:#fff;margin-top:26px;font-size:12.5px;font-weight:500}
.tk-done .ic{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#0593C6,#D83995);display:flex;align-items:center;justify-content:center}
.tk-done .ic svg{width:11px;height:11px;color:#fff}
.tk-lead{font-family:Manrope,Inter,sans-serif;font-size:clamp(22px,2.1vw,30px);font-weight:600;letter-spacing:-.03em;line-height:1.25;margin:22px 0 0;max-width:560px}
.tk-p{font-size:clamp(16.5px,1.3vw,18.5px);line-height:1.6;letter-spacing:-.01em;color:#6B7480;margin:16px 0 0;max-width:560px}
.tk-p b{color:#0E1116;font-weight:600}
.tk-rule{width:56px;height:2px;border-radius:1px;background:linear-gradient(90deg,#0593C6,#D83995);margin:30px 0 0}

}

.aq{color:#0E1116;font-family:Inter,system-ui,sans-serif}
.aq h1,.aq h2,.aq h3,.aq .num{font-family:Manrope,Inter,sans-serif}
.aq-sec{margin-top:110px}
.aq-k{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.75);border:1px solid #fff;color:#0E1116}
.aq-k i{width:7px;height:7px;border-radius:50%;background:#D83995}
.aq h2{font-size:clamp(32px,4vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1.04;margin:14px 0 12px}
.aq h2 span,.aq .grad{background:linear-gradient(90deg,#0593C6,#D83995);-webkit-background-clip:text;background-clip:text;color:transparent}
.aq .lead{font-size:18px;line-height:1.6;color:#3E4652;max-width:720px;margin:0}
.aq .glass{background:rgba(255,255,255,.72);border:1px solid #fff;border-radius:24px;box-shadow:0 14px 34px rgba(10,30,60,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
/* reveal-on-view inside the case study */
.aq [data-v]{opacity:0;translate:0 22px;transition:opacity .7s cubic-bezier(.2,.7,.2,1),translate .7s cubic-bezier(.2,.7,.2,1)}
.aq [data-v][data-on]{opacity:1;translate:0 0}
/* hero */
.aq-hero h1{font-size:clamp(40px,6vw,86px);font-weight:500;letter-spacing:-.05em;line-height:.98;margin:18px 0 18px;max-width:900px}
.aq-role{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:#3E4652}
.aq-role b{font-weight:600;color:#0E1116}
.aq-chip{font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;background:linear-gradient(90deg,rgba(5,147,198,.14),rgba(216,57,149,.14));color:#9A2A6C}
.aq-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.aq-tile{padding:22px 22px 20px}
.aq-tile .num{font-size:clamp(38px,4vw,54px);font-weight:500;letter-spacing:-.045em;line-height:1}
.aq-tile .lab{font-weight:600;font-size:15px;margin-top:12px}
.aq-tile .ln{font-size:13.5px;line-height:1.5;color:#5B6573;margin-top:4px}
/* the puzzle */
.aq-puz{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.aq-puz .glass{padding:24px}
.aq-puz .ic{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0593C6,#D83995);color:#fff;font-weight:600;font-family:Manrope,Inter,sans-serif}
.aq-puz h3{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:16px 0 6px}
.aq-puz p{margin:0;font-size:14.5px;line-height:1.55;color:#5B6573}
/* ownership chain */
.aq-chain{display:flex;align-items:center;gap:0;margin-top:30px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.aq-chain::-webkit-scrollbar{display:none}
.aq-node{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:96px}
.aq-node .dot{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid rgba(14,17,22,.12);font-size:12px;font-weight:600;color:#9AA3AE;transition:background .5s,color .5s,border-color .5s,transform .5s}
.aq-node.lit .dot{background:linear-gradient(135deg,#0593C6,#D83995);color:#fff;border-color:transparent;transform:scale(1.04)}
.aq-node span{font-size:13px;font-weight:500}
.aq-link{flex:1 0 24px;height:2px;min-width:24px;background:rgba(14,17,22,.1);position:relative;margin-top:-26px}
.aq-link:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0593C6,#D83995);transform-origin:left;transform:scaleX(0);transition:transform .45s ease}
.aq-link.lit:after{transform:scaleX(1)}
.aq-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#5B6573;margin-top:4px}
.aq-legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:linear-gradient(135deg,#0593C6,#D83995)}
.aq-rhythm{display:flex;align-items:center;gap:18px;margin-top:22px;padding:18px 22px}
.aq-clock{width:54px;height:54px;border-radius:50%;border:2px solid #0E1116;position:relative;flex:none}
.aq-clock:before,.aq-clock:after{content:"";position:absolute;left:50%;top:50%;width:2px;background:#0E1116;transform-origin:50% 0;border-radius:2px}
.aq-clock:before{height:16px;animation:aqspin 6s linear infinite}
.aq-clock:after{height:11px;animation:aqspin 72s linear infinite;background:#D83995}
@keyframes aqspin{from{transform:rotate(180deg)}to{transform:rotate(540deg)}}
.aq-rhythm p{margin:0;font-size:16px;line-height:1.5}
/* timeline */
.aq-tl{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px;padding-top:30px}
.aq-tl .bar{position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:rgba(14,17,22,.08);overflow:hidden}
.aq-tl .bar i{position:absolute;inset:0;background:linear-gradient(90deg,#0593C6,#D83995);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .2s linear}
.aq-tl .glass{padding:22px}
.aq-tl .m{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#0593C6}
.aq-tl h3{font-size:19px;margin:8px 0 6px;font-weight:600;letter-spacing:-.02em}
.aq-tl p{margin:0;font-size:14.5px;line-height:1.55;color:#5B6573}
/* research funnel */
.aq-funnel{display:grid;gap:10px;margin-top:28px}
.aq-fr{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:16px}
.aq-fr .step{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5B6573}
.aq-fr .barw{position:relative;height:54px}
.aq-fr .b{position:absolute;left:0;top:0;bottom:0;border-radius:16px;display:flex;align-items:center;padding:0 18px;color:#fff;font-size:15px;font-weight:500;white-space:nowrap;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1);overflow:hidden}
.aq-fr .b.n{background:linear-gradient(90deg,#0593C6,#3AA8D6)}
.aq-fr .b.x{background:repeating-linear-gradient(135deg,#C9D3DB 0 8px,#DCE3E9 8px 16px);color:#5B6573}
.aq-fr .b.w{background:linear-gradient(90deg,#B83C8A,#D83995)}
.aq-trackers{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.aq-lock{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:#0E1116;color:#fff;font-size:13.5px}
.aq-lock svg{width:13px;height:13px}
.aq-note{font-size:13.5px;color:#5B6573;margin-top:10px;font-style:italic}
/* content engine pipeline */
.aq-pipe{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px}
.aq-pipe .st{padding:12px 16px;border-radius:14px;background:#fff;border:1px solid rgba(14,17,22,.08);font-size:14px;font-weight:500;box-shadow:0 6px 16px rgba(10,30,60,.05)}
.aq-pipe .st:nth-child(odd){}
.aq-pipe .ar{color:#D83995;font-weight:700}
.aq-brief{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:26px;font-size:15px}
.aq-seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:rgba(14,17,22,.06)}
.aq-seg button{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:9px;border:0;background:none;cursor:pointer;color:#5B6573}
.aq-seg button.on{background:#fff;color:#0E1116;box-shadow:0 2px 8px rgba(10,30,60,.1)}
.aq-idea{flex:1;min-width:220px;border-bottom:2px dashed rgba(14,17,22,.2);height:30px}
/* the shot sheet */
.aq-sheet{margin-top:18px;overflow-x:auto;border-radius:22px}
.aq-sheet table{width:100%;min-width:980px;border-collapse:separate;border-spacing:0;font-size:13.5px;background:rgba(255,255,255,.8)}
.aq-sheet th{position:sticky;top:0;background:#fff;text-align:left;font-weight:600;font-size:12.5px;padding:12px 12px 14px;border-bottom:1px solid rgba(14,17,22,.08);vertical-align:bottom}
.aq-sheet .stk{display:inline-flex!important;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;border:1.5px dashed rgba(216,57,149,.45);background:rgba(216,57,149,.05);color:#B83C8A;font-size:10px;font-weight:600;text-align:center;line-height:1.1;transition:scale .25s}
.aq-sheet img.stk{border:0;border-radius:0;background:none;object-fit:contain;width:68px;height:68px;filter:drop-shadow(0 4px 8px rgba(10,30,60,.18))}
.aq-sheet .stk:hover{scale:1.1}
.aq-sheet td{padding:10px 12px;border-bottom:1px solid rgba(14,17,22,.06);height:58px;color:#3E4652;vertical-align:middle}
.aq-sheet td:first-child{font-weight:600;color:#9AA3AE;width:44px}
.aq-sheet tr.fade td{opacity:.45}
.aq-sheet .more{padding:14px;text-align:center;font-size:13px;color:#5B6573;background:rgba(255,255,255,.6)}
.aq-batch{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.aq-batch .glass{padding:22px}
.aq-batch h3{font-size:17px;font-weight:600;margin:0 0 6px}
.aq-batch p{font-size:14.5px;line-height:1.55;color:#5B6573;margin:0}
/* reels */
.aq-reels{display:grid;grid-template-columns:16fr 9fr 9fr;align-items:center;gap:28px;max-width:1056px;margin:26px auto 0}
.aq-reel{display:flex;flex-direction:column;gap:10px;width:100%;min-width:0}
.aq-phone{position:relative;aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,#BFE3F2,#F3C3DD);border:6px solid #0E1116;box-shadow:0 20px 40px rgba(10,30,60,.18)}
.aq-phone video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0E1116}
.aq-phone.wide{aspect-ratio:16/9;border-radius:24px}
.aq-phone .spin{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:aqspin .8s linear infinite;pointer-events:none}
@keyframes aqspin{to{rotate:360deg}}
.aq-phone .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.9);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.aq-phone .play:after{content:"";border-left:18px solid #0E1116;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.aq-phone .ph{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:rgba(14,17,22,.55)}
.aq-stage{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 10px;border-radius:999px;color:#fff}
.aq-rh{display:flex;align-items:center;gap:10px;font-size:13px;color:#5B6573;white-space:nowrap}
.aq-stage.t{background:#0593C6}.aq-stage.m{background:#7B5BC9}.aq-stage.b{background:#D83995}
.aq-reel a{font-size:13.5px;color:#0593C6;text-decoration:none;font-weight:500}
/* outreach funnel */
.aq-out{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:28px;align-items:end}
.aq-oc{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.aq-oc .col{border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,#0593C6,#D83995);height:0;transition:height 1s cubic-bezier(.2,.7,.2,1)}
.aq-oc .t{font-size:13px;font-weight:600;text-align:center}
.aq-oc .v{font-family:Manrope,Inter,sans-serif;font-size:22px;font-weight:600;text-align:center;letter-spacing:-.03em}
.aq-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:22px}
.aq-steps .glass{padding:16px;border-radius:18px}
.aq-steps .s{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0593C6}
.aq-steps p{font-size:13.5px;line-height:1.5;color:#3E4652;margin:8px 0}
.aq-steps .r{font-size:12.5px;font-weight:600;color:#9A2A6C}
.aq-pull{margin-top:22px;font-size:20px;font-weight:500;letter-spacing:-.02em;font-family:Manrope,Inter,sans-serif}
/* paid: channel mix + funnel */
.aq-mix{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;margin-top:26px}
.aq-ch{padding:22px;border-radius:24px;color:#fff;position:relative;overflow:hidden}
.aq-ch.li{background:linear-gradient(135deg,#0A66C2,#0593C6)}
.aq-ch.go{background:linear-gradient(135deg,#3F5BD6,#7B5BC9)}
.aq-ch.me{background:linear-gradient(135deg,#B83C8A,#D83995)}
.aq-ch .nm{font-family:Manrope,Inter,sans-serif;font-size:28px;font-weight:600;letter-spacing:-.03em}
.aq-ch .kk{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22)}
.aq-ch p{margin:12px 0 0;font-size:14px;line-height:1.5;opacity:.92}
.aq-fun{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:22px}
.aq-stg{display:grid;grid-template-columns:1.1fr auto 1.3fr;gap:16px;align-items:center;padding:16px 22px;border-radius:20px;background:rgba(255,255,255,.8);border:1px solid #fff;box-shadow:0 10px 26px rgba(10,30,60,.05);transition:opacity .6s ease,translate .6s cubic-bezier(.2,.7,.2,1);box-sizing:border-box}
.aq-stg .l b{display:block;font-size:15px}.aq-stg .l span{font-size:13.5px;color:#0593C6;font-style:italic}
.aq-stg .c{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.aq-stg .pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;color:#fff}
.aq-stg .pill.li{background:#0A66C2}.aq-stg .pill.go{background:#5B57D1}.aq-stg .pill.me{background:#D83995}
.aq-stg .w{font-size:13.5px;color:#3E4652}
/* learned / differently */
.aq-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
.aq-two .glass{padding:26px}
.aq-two h3{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0593C6;margin:0 0 14px}
.aq-two .it{padding:14px 0;border-top:1px solid rgba(14,17,22,.07)}
.aq-two .it:first-of-type{border-top:0;padding-top:0}
.aq-two .it b{display:block;font-size:16px;letter-spacing:-.01em;margin-bottom:4px}
.aq-two .it span{font-size:14.5px;line-height:1.55;color:#5B6573}
.aq-close{margin-top:120px;text-align:center}
.aq-close p{font-family:Manrope,Inter,sans-serif;font-size:clamp(30px,4.6vw,60px);font-weight:500;letter-spacing:-.04em;line-height:1.08;margin:0 auto;max-width:900px}
@media (max-width:900px){
  .aq-tiles{grid-template-columns:1fr 1fr}.aq-puz,.aq-tl,.aq-reels{grid-template-columns:1fr}.aq-reel{max-width:280px;justify-self:center}.aq-reel.wide{max-width:520px}.aq-batch,.aq-two{grid-template-columns:1fr}
  .aq-fr{grid-template-columns:1fr;gap:6px}.aq-out{grid-template-columns:repeat(3,1fr)}.aq-steps,.aq-lessons{grid-template-columns:1fr 1fr}
  .aq-mix{grid-template-columns:1fr}.aq-stg{width:100%!important;grid-template-columns:1fr;gap:8px}.aq-stg .c{justify-content:flex-start}.aq-sec{margin-top:80px}

/* drop workback track */
.fn-track{display:flex;align-items:flex-start;margin-top:30px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.fn-track::-webkit-scrollbar{display:none}
.fn-signs{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:14px}
.fn-sign{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid rgba(14,17,22,.08);font-size:14px;font-weight:500;color:#9AA3AE;transition:color .4s,border-color .4s,box-shadow .4s}
.fn-sign i{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(14,17,22,.18);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:transparent;transition:all .4s}
.fn-sign.ok{color:#0E1116;border-color:rgba(5,147,198,.35);box-shadow:0 6px 16px rgba(5,147,198,.12)}
.fn-sign.ok i{background:linear-gradient(135deg,#0593C6,#D83995);border-color:transparent;color:#fff}
.fn-gate{margin-top:14px;text-align:right;font-family:Manrope,Inter,sans-serif;font-size:18px;font-weight:600;letter-spacing:-.02em;transition:opacity .5s}
/* meta drop cycle */
.fn-cycle{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:26px;align-items:stretch}
.fn-chart{padding:22px 22px 14px}
.fn-chart svg{width:100%;height:auto;display:block;overflow:visible}
.fn-chart .ax{font-size:12px;fill:#8A93A0;font-family:Inter,sans-serif}
.fn-zone{cursor:pointer;transition:fill .3s}
.fn-phase{padding:24px;display:flex;flex-direction:column;gap:14px}
.fn-phase .row{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:14.5px;line-height:1.5;color:#3E4652}
.fn-phase .row b{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#0593C6;padding-top:2px}
.fn-phase .why{margin-top:auto;padding:14px 16px;border-radius:16px;background:linear-gradient(90deg,rgba(5,147,198,.10),rgba(216,57,149,.10));font-size:14.5px;line-height:1.5}
.fn-phase .why b{color:#9A2A6C}
/* creative loop */
.fn-loop{display:grid;grid-template-columns:420px 1fr;gap:40px;align-items:center;margin-top:24px}
.fn-ring{position:relative;width:380px;height:380px;margin:0 auto}
.fn-ring:before{content:"";position:absolute;inset:48px;border-radius:50%;border:2px dashed rgba(14,17,22,.14)}
.fn-ring .spin{position:absolute;inset:48px;border-radius:50%;border:2px solid transparent;border-top-color:#D83995;animation:fnspin 6s linear infinite}
@keyframes fnspin{to{rotate:360deg}}
.fn-ln{position:absolute;width:128px;margin:-30px 0 0 -64px;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid rgba(14,17,22,.08);font-size:13px;font-weight:500;line-height:1.35;text-align:center;box-shadow:0 8px 20px rgba(10,30,60,.06);transition:background .4s,color .4s,transform .4s}
.fn-ln.on{background:linear-gradient(135deg,#0593C6,#D83995);color:#fff;transform:scale(1.06)}
.fn-cap{font-family:Manrope,Inter,sans-serif;font-size:clamp(22px,2.6vw,32px);font-weight:500;letter-spacing:-.03em;line-height:1.2;margin:0}
.fn-cap+p{font-size:15px;line-height:1.6;color:#5B6573;margin:14px 0 0}
/* hygiene + google + retention */
.fn-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.fn-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.fn-card{padding:24px}
.fn-card .kk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0593C6}
.fn-card h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:10px 0 8px}
.fn-card p{margin:0;font-size:14.5px;line-height:1.55;color:#5B6573}
.fn-feed{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fn-feed span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(14,17,22,.06);color:#3E4652}
.fn-g{padding:24px;border-radius:24px;color:#fff}
.fn-g.s{background:linear-gradient(135deg,#3F5BD6,#0593C6)}.fn-g.sh{background:linear-gradient(135deg,#5B57D1,#7B5BC9)}.fn-g.p{background:linear-gradient(135deg,#7B5BC9,#D83995)}
.fn-g .nm{font-family:Manrope,Inter,sans-serif;font-size:24px;font-weight:600;letter-spacing:-.03em}
.fn-g p{margin:10px 0 0;font-size:14.5px;line-height:1.5;opacity:.94}
.fn-shared{margin-top:12px;font-size:14px;color:#5B6573}
/* blended vs platform */
.fn-formula{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding:14px 18px;border-radius:16px;background:#fff;border:1px solid rgba(14,17,22,.08);font-size:15px}
.fn-formula .fr{display:inline-flex;flex-direction:column;align-items:center;font-weight:600;font-size:13.5px}
.fn-formula .fr span:first-child{border-bottom:1.5px solid #0E1116;padding:0 6px 2px}
.fn-formula .fr span:last-child{padding:2px 6px 0}
.fn-dec{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.fn-sc{padding:20px;border-radius:22px;border:1.5px solid rgba(14,17,22,.08);background:rgba(255,255,255,.75);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .3s,box-shadow .3s,translate .3s}
.fn-sc:hover{translate:0 -2px}
.fn-sc.on{border-color:#D83995;box-shadow:0 14px 30px rgba(216,57,149,.14)}
.fn-sc .ar{display:flex;gap:16px;font-size:13px;color:#5B6573}
.fn-sc .ar b{display:block;font-family:Manrope,Inter,sans-serif;font-size:28px;line-height:1;margin-bottom:4px}
.fn-sc .ar b.u{color:#0593C6}.fn-sc .ar b.f{color:#8A93A0}.fn-sc .ar b.d{color:#D83995}
.fn-sc .act{margin-top:16px;font-family:Manrope,Inter,sans-serif;font-size:22px;font-weight:600;letter-spacing:-.02em}
.fn-sc .sub{font-size:13.5px;color:#5B6573;margin-top:4px;min-height:20px}
.fn-guard{margin-top:16px;padding:24px 26px;border-radius:24px;background:#0E1116;color:#fff}
.fn-guard .kk{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7FD3F2}
.fn-guard p{margin:10px 0 0;font-size:16px;line-height:1.6;opacity:.92}
.fn-guard .bar{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:18px;overflow:hidden}
.fn-guard .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#0593C6,#D83995);transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.fn-guard .bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;text-decoration:none}
.fn-guard .lg{display:flex;justify-content:space-between;font-size:12px;opacity:.7;margin-top:8px}
.fn-flows{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fn-flows span{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:linear-gradient(90deg,rgba(5,147,198,.14),rgba(216,57,149,.14));color:#9A2A6C}
.fn-big{font-family:Manrope,Inter,sans-serif;font-size:56px;font-weight:500;letter-spacing:-.045em;line-height:1}
.fn-lessons{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.fn-lessons .glass{padding:24px}
.fn-lessons b{display:block;font-family:Manrope,Inter,sans-serif;font-size:19px;letter-spacing:-.02em;margin-bottom:6px}
.fn-lessons span{font-size:14.5px;line-height:1.55;color:#5B6573}
@media (max-width:900px){
  .fn-cycle,.fn-loop,.fn-2,.fn-3,.fn-dec,.fn-lessons{grid-template-columns:1fr}
  .fn-ring{width:300px;height:300px}.fn-ring:before,.fn-ring .spin{inset:40px}.fn-ln{width:108px;margin:-28px 0 0 -54px;font-size:11.5px;padding:8px}
  .fn-signs{justify-content:flex-start}.fn-gate{text-align:left}
}
@media (prefers-reduced-motion:reduce){.fn-ring .spin{animation:none}}
