html,body{background:#EAF5FA;margin:0}
.pr{position:relative;height:100vh;height:100svh;overflow:hidden;background:#F9EADF;touch-action:none}
.pr-stage{position:absolute;inset:0;overflow:hidden;background:#F9EADF}
.pr-media{position:absolute;inset:0;will-change:transform}
.pr-media video,.pr-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.pr-poster{transition:opacity .3s ease}
.pr-bar{position:absolute;left:0;right:0;height:7vh;background:#0B0708;z-index:3}
.pr-bar.top{top:0;transform-origin:top}.pr-bar.bot{bottom:0;transform-origin:bottom}
.pr-credit{position:absolute;left:clamp(24px,4.6vw,76px);top:50%;transform:translateY(-55%);z-index:4;text-align:left;color:#170D0F;font-family:"Playfair Display",Georgia,serif;
  transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.pr-credit .name span{display:block;font-weight:900;font-size:clamp(44px,5.4vw,86px);line-height:.95;letter-spacing:-.01em}
.pr-credit .presents{display:block;margin-top:14px;font-size:clamp(20px,2.1vw,32px);font-style:italic;font-weight:400}
.pr-cue{position:absolute;left:50%;bottom:calc(7vh + 1.6vh);transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:7px;color:#FFF7F9;font-family:"Playfair Display",Georgia,serif;font-size:13px;font-weight:700;letter-spacing:.38em;padding-left:.38em;text-transform:uppercase;text-shadow:0 1px 14px rgba(11,7,8,.75);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.pr-cue i{display:block;width:1.5px;height:30px;background:linear-gradient(#FFF7F9,rgba(255,247,249,0));animation:prcue 1.6s ease-in-out infinite}
@keyframes prcue{0%{transform:scaleY(.2);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:bottom}}
.pr-sound{position:absolute;top:calc(3.5vh - 15px);right:max(16px,3vw);z-index:8;display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,247,249,.6);background:rgba(11,7,8,.35);color:#FFF7F9;font:13px "Playfair Display",Georgia,serif;letter-spacing:.06em;cursor:pointer}
.pr-sound:focus-visible{outline:2px solid #F27D9A;outline-offset:3px}
.pr-sound svg{width:15px;height:15px}
.pr-flood{position:absolute;inset:0;z-index:6;pointer-events:none;background:#3F8FD0 url(bg-glass.webp) center/cover no-repeat;clip-path:circle(0px at 50% 50%);-webkit-clip-path:circle(0px at 50% 50%)}
.pr.played .pr-credit,.pr.played .pr-cue{opacity:0}
.pr.played .pr-credit{transform:translate(-14px,-55%)}
.pr.played .pr-cue{transform:translate(-50%,8px)}
@media (max-width:820px),(max-aspect-ratio:5/4){
  .pr-bar{height:5vh}
  .pr-credit{left:0;right:0;top:auto;bottom:calc(5vh + 10vh);transform:none;text-align:center;color:#FFF7F9;text-shadow:0 2px 22px rgba(11,7,8,.85)}
  .pr-credit .name{display:block;padding-left:.14em}
  .pr-credit .name span{display:inline;font-size:clamp(22px,6.4vw,40px);letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
  .pr-credit .presents{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px;font-size:clamp(16px,4.4vw,22px)}
  .pr-credit .presents::before,.pr-credit .presents::after{content:"";width:clamp(36px,12vw,64px);height:1px;background:#FFF7F9;opacity:.75}
  .pr.played .pr-credit{transform:translateY(8px)}
  .pr-cue{bottom:calc(5vh + 1.6vh)}.pr-sound{top:calc(2.5vh - 15px)}

.hi{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#3F8FD0;color:#fff;font-family:Inter,system-ui,sans-serif}
.hi h1,.hi .big,.hi .logo{font-family:Manrope,Inter,sans-serif}
.hi-bg{position:absolute;inset:-12% 0;pointer-events:none;background:#3F8FD0 url(bg-glass.webp) center/cover no-repeat}
.hi-glass{background:rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.28)}
.hi .logo{font-size:19px;font-weight:600;letter-spacing:-.02em}
.hi-btn{height:42px;padding:0 18px;border-radius:999px;background:#fff;color:#0E1116;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none}
.hi-h{position:absolute;top:112px;left:0;right:0;text-align:center;z-index:4;padding:0 24px}
.hi-h h1{font-weight:500;font-size:clamp(40px,5.2vw,78px);line-height:1.02;letter-spacing:-.045em;margin:0}
.hi-left{position:absolute;left:48px;bottom:170px;z-index:4;max-width:330px}
.hi-left p{margin:0 0 22px;font-size:18px;line-height:1.5;color:rgba(255,255,255,.92)}
.hi-char{position:absolute;left:0;right:0;margin:0 auto;bottom:118px;width:min(500px,38vw);aspect-ratio:1312/1199;z-index:3}
.hi-card{position:absolute;right:48px;top:300px;width:340px;padding:18px;border-radius:24px;z-index:4}
.hi-card .bar{width:46px;height:4px;border-radius:3px;background:rgba(255,255,255,.7);margin:0 auto 16px}
.hi-card .loc{font-size:13.5px;opacity:.9;margin:0 4px 12px}
.hi-gc{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);margin-top:10px}
.hi-gc .t{display:flex;justify-content:space-between;font-size:14px;opacity:.9}.hi-gc .t small{font-size:12px;opacity:.8}
.hi-gc .big{font-size:24px;font-weight:500;margin-top:10px;letter-spacing:-.025em}.hi-gc .lbl{font-size:13px;opacity:.8;margin-top:4px}
.hi-gc .ls{display:inline-block;margin-top:10px;font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#D83995;font-weight:500}
.hi-facts{position:absolute;left:48px;right:48px;bottom:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:24px;border-top:1px solid rgba(255,255,255,.32);padding-top:22px;z-index:4}
.hi-facts div{position:relative;font-size:14px;line-height:1.45;color:rgba(255,255,255,.78)}.hi-facts b{display:block;font-size:15.5px;margin-bottom:6px;font-weight:500;color:#fff}
.hi-facts div:first-child:before{content:"";position:absolute;top:-23px;left:0;width:180px;height:2px;background:#fff}
/* tablets: card moves under the headline area, character slightly smaller */
@media (max-width:1100px){.hi-card{top:auto;bottom:170px;width:300px}.hi-char{width:min(440px,42vw)}.hi-facts{grid-template-columns:repeat(3,1fr)}.hi-facts div:nth-child(n+4){display:none}}
/* phones: everything stacks in one column */
@media (max-width:760px){
  .hi{display:flex;flex-direction:column;align-items:stretch;padding:84px 20px 28px}
    .hi-h,.hi-left,.hi-char,.hi-card,.hi-facts{position:relative;inset:auto;transform:none;left:auto;right:auto;top:auto;bottom:auto}
  .hi-h{padding:0;text-align:left}.hi-h h1{font-size:40px}
  .hi-left{max-width:none;margin-top:12px}.hi-left p{font-size:16px;margin-bottom:0}.hi-left .hi-btn{display:none}
  .hi-char{width:min(340px,86vw);margin:18px auto 0}
  .hi-card{width:auto;margin-top:16px}
